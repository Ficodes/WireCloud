name: Python package

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install package builder
        run: python -m pip install --upgrade build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel installation
        run: |
          python -m pip install --no-deps --target /tmp/wirecloud-wheel-check dist/*.whl
          PYTHONPATH=/tmp/wirecloud-wheel-check python -c "import wirecloud"

      - name: Store wheel
        uses: actions/upload-artifact@v7
        with:
          name: wirecloud-wheel
          path: dist/*.whl
          if-no-files-found: error

  attach_to_release:
    name: Attach wheel to release
    if: github.event_name == 'release'
    needs: build_wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built wheel
        uses: actions/download-artifact@v8
        with:
          name: wirecloud-wheel
          path: dist

      - name: Upload wheel to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl --clobber --repo "$GITHUB_REPOSITORY"

  publish_docker_image:
    name: Publish Docker image
    if: github.event_name == 'release'
    needs: build_wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}
      DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || 'fiware/wirecloud' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select registry credentials
        id: registry_credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "$DOCKER_REGISTRY" != "docker.io" ] && [[ "$DOCKER_IMAGE" != "$DOCKER_REGISTRY/"* ]]; then
            echo "::error::DOCKER_IMAGE must start with $DOCKER_REGISTRY/ for the configured registry"
            exit 1
          fi

          if [ -n "$DOCKER_USERNAME" ] || [ -n "$DOCKER_TOKEN" ]; then
            if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_TOKEN" ]; then
              echo "::error::DOCKER_USERNAME and DOCKER_TOKEN must be configured together"
              exit 1
            fi
            echo "source=generic" >> "$GITHUB_OUTPUT"
          elif [ "$DOCKER_REGISTRY" = "docker.io" ]; then
            if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
              echo "::error::Configure DOCKER_USERNAME and DOCKER_TOKEN, or the Docker Hub fallback secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"
              exit 1
            fi
            echo "source=dockerhub" >> "$GITHUB_OUTPUT"
          else
            echo "::error::DOCKER_USERNAME and DOCKER_TOKEN are required for the configured registry $DOCKER_REGISTRY"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in with configured registry credentials
        if: steps.registry_credentials.outputs.source == 'generic'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in with Docker Hub fallback credentials
        if: steps.registry_credentials.outputs.source == 'dockerhub'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
