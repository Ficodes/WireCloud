<s:styledgui xmlns:s="http://wirecloud.conwet.fi.upm.es/StyledElements" xmlns:t="http://wirecloud.conwet.fi.upm.es/Template" xmlns="http://www.w3.org/1999/xhtml">

    <h6>{{ trans('Description') }}</h6>
    <article class="markdown-body"><t:longdescription/></article>

    <h6>{{ trans('Tags') }}</h6>
    <div class="tag_cloud"><t:tags>{"max": 3}</t:tags></div>

    <h6>{{ trans('Detailed data') }}</h6>
    <dl class="wc-resource-data">
        <dt>{{ trans('Internal ID') }}</dt>
        <dd class="mono"><t:internalname/></dd>
        <dt>{{ trans('Author(s)') }}</dt>
        <t:authors/>
        <dt>{{ trans('Contributor(s)') }}</dt>
        <t:contributors/>
        <dt>{{ trans('Size') }}</dt>
        <dd class="mono"><t:size/></dd>
    </dl>

    <h6>{{ trans('Advanced operations') }}</h6>
    <div class="advanced_operations"><t:advancedops/></div>
</s:styledgui>
