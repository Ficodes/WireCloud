<s:styledgui xmlns:s="http://wirecloud.conwet.fi.upm.es/StyledElements" xmlns:t="http://wirecloud.conwet.fi.upm.es/Template" xmlns="http://www.w3.org/1999/xhtml">
<s:horizontallayout class="resource_details full">

    <s:westcontainer>
        <div class="wc-resource-details-summary">
            <div class="se-thumbnail se-thumbnail-sm blueprint"><i class="corner tl" aria-hidden="true"/><i class="corner tr" aria-hidden="true"/><i class="corner bl" aria-hidden="true"/><i class="corner br" aria-hidden="true"/><t:image/></div>
            <t:rating/>
            <t:mainbutton/>

            <div class="links">
                <t:home/>
                <t:license_home/>
                <t:issuetracker/>
            </div>
            <dl class="summary">
                <dt>{{ trans('Vendor') }}</dt>
                <dd><t:vendor/></dd>
                <dt>{{ trans('Version') }}</dt>
                <dd class="mono"><t:version/></dd>
                <dt>{{ trans('License') }}</dt>
                <dd><t:license/></dd>
                <dt>{{ trans('Last Updated') }}</dt>
                <dd><t:lastupdate/></dd>
            </dl>
        </div>
    </s:westcontainer>

    <s:centercontainer class="description_column">
        <t:details/>
    </s:centercontainer>

</s:horizontallayout>
</s:styledgui>
